<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}autoclock{% endblock %}</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem;
       max-width: 32rem; margin-inline: auto; font-size: 1.1rem; }
h1 { font-size: 1.4rem; }
.big { display: block; width: 100%; padding: 1rem; margin: .5rem 0;
       font-size: 1.25rem; border: 0; border-radius: .75rem; cursor: pointer;
       background: #2563eb; color: #fff; text-align: center; text-decoration: none; }
.big.stop { background: #b91c1c; }
.big.muted { background: #6b7280; }
.warn { background: #fef3c7; color: #78350f; border: 1px solid #f59e0b;
        border-radius: .5rem; padding: .75rem; margin: .75rem 0; }
@media (prefers-color-scheme: dark) {
  .warn { background: #451a03; color: #fbbf24; }
}
.state { padding: .75rem; border-radius: .5rem; margin-bottom: 1rem;
         background: rgba(127,127,127,.15); }
table { border-collapse: collapse; width: 100%; }
th, td { padding: .4rem .5rem; text-align: left; border-bottom: 1px solid rgba(127,127,127,.3); }
td.num, th.num { text-align: right; }
a { color: #2563eb; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
