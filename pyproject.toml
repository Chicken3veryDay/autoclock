[project]
name = "autoclock"
version = "0.1.0"
description = "Personal self-hosted time tracker driven by phone geofence events"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pywebpush>=2.5.0",
    "http-ece>=1.2.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["."]
